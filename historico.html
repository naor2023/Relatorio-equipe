<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Historico de Ocorrencias</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <strong>Historico</strong>
    <nav><a href="/central.html">Central</a><a href="/admin.html" data-admin>Admin</a><button id="logoutBtn">Sair</button></nav>
  </header>
  <main class="page">
    <section class="panel">
      <h1>Consultar ocorrencias</h1>
      <p>O historico permanece salvo no banco local para consulta da Central e da administracao, inclusive registros antigos.</p>
      <form id="filters" class="filters">
        <label>De
          <div class="date-field" data-date-field>
            <input id="fromDisplay" class="date-display" type="text" inputmode="numeric" placeholder="dd/mm/aaaa" autocomplete="off">
            <input id="fromValue" name="from" type="hidden">
            <button type="button" class="date-trigger" data-date-button="fromValue" aria-label="Abrir calendario inicial">📅</button>
          </div>
        </label>
        <label>Ate
          <div class="date-field" data-date-field>
            <input id="toDisplay" class="date-display" type="text" inputmode="numeric" placeholder="dd/mm/aaaa" autocomplete="off">
            <input id="toValue" name="to" type="hidden">
            <button type="button" class="date-trigger" data-date-button="toValue" aria-label="Abrir calendario final">📅</button>
          </div>
        </label>
        <label>Local<input name="location"></label>
        <label>Tipo<input name="type"></label>
        <label>Status<select name="status"><option value="">Todos</option></select></label>
        <label>Colaborador<input name="collaborator"></label>
        <button class="primary">Filtrar</button>
        <button type="button" id="csvBtn">Exportar Excel/CSV</button>
        <button type="button" id="pdfBtn">Relatorio PDF</button>
        <div id="historyDatePicker" class="history-date-picker" hidden></div>
      </form>
      <div class="table-wrap">
        <table>
          <thead><tr><th>N.</th><th>Data</th><th>Colaborador</th><th>Local</th><th>Tipo</th><th>Status</th><th>Descricao</th></tr></thead>
          <tbody id="historyRows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
