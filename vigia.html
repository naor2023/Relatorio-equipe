<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrar Ocorrencia</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <strong>Registro de Ocorrencia</strong>
    <nav><a href="/">Acesso da Central</a></nav>
  </header>
  <main class="mobile-shell field-report-shell">
    <section class="field-hero">
      <div>
        <span class="form-eyebrow">Registro rapido</span>
        <h1>Nova ocorrencia</h1>
        <p>Preencha apenas os dados essenciais e envie. A Central recebe o registro automaticamente para investigar.</p>
      </div>
      <div class="field-status">
        <strong>Status inicial</strong>
        <span>Nova ocorrencia</span>
      </div>
    </section>
    <section class="panel field-card">
      <form id="occurrenceForm">
        <label>Nome do colaborador<input name="collaborator_name" required></label>
        <div class="form-row">
          <label>Local da ocorrencia<select name="location" required></select></label>
          <label>Tipo da ocorrencia<select name="type" required></select></label>
        </div>
        <label>Descricao detalhada<textarea name="description" rows="6" required></textarea></label>
        <label class="upload-box">
          <span>Foto ou video</span>
          <input name="attachment" type="file" accept="image/*,video/*">
          <small>Anexe somente se ajudar a Central na investigacao.</small>
        </label>
        <button class="primary" type="submit">Enviar ocorrencia</button>
        <output id="formMessage"></output>
      </form>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
