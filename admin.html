<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administracao</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <strong>Administracao</strong>
    <nav><a href="/central.html">Central</a><a href="/historico.html">Historico</a><button id="logoutBtn">Sair</button></nav>
  </header>
  <main class="page">
    <section class="panel">
      <h1>Administrar sistema</h1>
      <div class="admin-grid">
        <form id="userForm">
          <h2>Novo usuario</h2>
          <label>Nome<input name="name" required></label>
          <label>Usuario<input name="username" required></label>
          <label>Senha<input name="password" type="password" required></label>
          <label>Perfil<select name="role"><option value="vigia">Vigia/Controlador</option><option value="central">Central</option><option value="admin">Administrador</option></select></label>
          <button class="primary">Cadastrar usuario</button>
        </form>
        <form id="locationForm">
          <h2>Novo local</h2>
          <label>Local<input name="name" required></label>
          <button class="primary">Cadastrar local</button>
        </form>
        <form id="typeForm">
          <h2>Novo tipo</h2>
          <label>Tipo de ocorrencia<input name="name" required></label>
          <button class="primary">Cadastrar tipo</button>
        </form>
      </div>
      <output id="adminMessage"></output>
      <h2>Usuarios</h2>
      <div class="table-wrap"><table><thead><tr><th>Nome</th><th>Usuario</th><th>Perfil</th><th>Ativo</th><th>Acoes</th></tr></thead><tbody id="userRows"></tbody></table></div>
      <h2>Locais</h2>
      <p id="locationList" class="chips"></p>
      <h2>Tipos</h2>
      <p id="typeList" class="chips"></p>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
