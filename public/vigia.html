<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrar Ocorrencia</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <strong>Registro do Vigia</strong>
    <nav><a href="/historico.html">Historico</a><button id="logoutBtn">Sair</button></nav>
  </header>
  <main class="mobile-shell">
    <section class="panel">
      <h1>Nova ocorrencia</h1>
      <form id="occurrenceForm">
        <label>Nome do colaborador<input name="collaborator_name" required></label>
        <label>Local da ocorrencia<select name="location" required></select></label>
        <label>Tipo da ocorrencia<select name="type" required></select></label>
        <label>Descricao detalhada<textarea name="description" rows="6" required></textarea></label>
        <label>Foto ou video<input name="attachment" type="file" accept="image/*,video/*"></label>
        <button class="primary" type="submit">Enviar ocorrencia</button>
        <output id="formMessage"></output>
      </form>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
